{% extends 'base.html' %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-success">
            <div class="card-header bg-success text-white">
                <h2 class="mb-0">✅ Пароль изменён</h2>
            </div>
            <div class="card-body text-center">
                <p class="lead">Ваш пароль успешно изменён!</p>
                <p>Теперь вы можете войти, используя новый пароль.</p>
                <a href="{% url 'users:login' %}" class="btn btn-success mt-3">🔐 Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
