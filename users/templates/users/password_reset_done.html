{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-success">
            <div class="card-header bg-success text-white">
                <h2 class="mb-0">📧 Письмо отправлено</h2>
            </div>
            <div class="card-body text-center">
                <p class="lead">Мы отправили вам инструкцию по восстановлению пароля.</p>
                <p>Если вы не получили письмо в течение нескольких минут, проверьте папку "Спам".</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">🔐 Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
