<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        /* Кастомные стили для карточек */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 50px 0;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card-custom {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            flex: 1;
            min-width: 200px;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .card-custom h2 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 18px;
        }

        .card-custom .number {
            font-size: 48px;
            font-weight: bold;
            color: #007bff;
            margin: 0;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Bootstrap навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'mailing:home' %}">📧 Рассылки</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'mailing:recipient_list' %}">Получатели</a>
                <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

<div class="container">
        <footer class="pt-4 my-md-5 pt-md-5 border-top">
            <div class="row">
                <div class="col-12 col-md">
                    Сервис рассылок
                    <small class="d-block mb-3 text-muted">&copy; 2026</small>
                </div>
                <div class="col-6 col-md">
                    <h5>Категории</h5>
                    <ul class="list-unstyled text-small">
                        <li><a class="text-muted" href="#">Телеграм боты</a></li>
                        <li><a class="text-muted" href="#">Полезные утилиты</a></li>
                        <li><a class="text-muted" href="#">Веб-приложения</a></li>
                        <li><a class="text-muted" href="#">Микросервисы</a></li>
                    </ul>
                </div>
                <div class="col-6 col-md">
                    <h5>Дополнительно</h5>
                    <ul class="list-unstyled text-small">
                        <li><a class="text-muted" href=#>Мы пишем</a></li>
                    </ul>
                </div>
                <div class="col-6 col-md">
                    <h5>О нас</h5>
                    <ul class="list-unstyled text-small">
                        <li><a class="text-muted" href=#>Контакты</a></li>
                    </ul>
                </div>
            </div>
        </footer>

    </div>

</body>
</html>
